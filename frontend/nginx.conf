server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # config.js must not be cached, it can change on restart
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # send all routes to index.html (React Router handles them)
    location / {
        try_files $uri /index.html;
    }
}
